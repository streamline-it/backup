- name: ensure the remote drive has a gpt label
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  community.general.bsdinit:
    name: "{{ backup_external_drive['dev_name'] }}"
    scheme: "{{ backup_freebsd_disk_scheme }}"
    state: present

- name: ensure the remote drive has a partition
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  community.general.bsdinit:
    name: "{{ backup_external_drive['full_name'] }}"
    type: "{{ backup_external_drive_fstype }}"
    state: present

- name: ensure the remote drive has a label
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  community.general.bsdlabel:
    name: "{{ backup_external_drive['full_name'] }}"
    label: "{{ backup_external_drive['label'] }}"
    state: present

- name: ensure the remote drive has a filesystem
  when:
    - backup_external_drive_option == true
  community.general.bsdinit:
    dev: "{{ backup_external_drive['full_name'] }}1"
    fstype: "{{ backup_external_drive['fstype'] }}"
    state: formatted

