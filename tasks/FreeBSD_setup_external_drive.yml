- name: ensure the remote drive has a gpt label
  ignore_errors: true
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  args:
    creates: "/dev/{{ backup_external_drive[0]['full_name'] }}"
  ansible.builtin.command:
    cmd: "gpart create -s {{ backup_freebsd_disk_scheme }} {{ backup_external_drive[0]['dev_name'] }}"

- name: ensure the remote drive has a partition
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  args:
    creates: "/dev/{{ backup_external_drive[0]['full_name'] }}"
  ansible.builtin.command:
    cmd: "gpart add -t {{ backup_external_drive[0]['fstype'] }} {{ backup_external_drive[0]['dev_name'] }}"

- name: ensure the remote drive has a label
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  ansible.builtin.command:
    cmd: "glabel label {{ backup_external_drive[0]['label'] }} {{ backup_external_drive[0]['full_name'] }}"

- name: ensure the remote drive has a filesystem
  when:
    - backup_external_drive_option == true
  ansible.builtin.command:
    cmd: "newfs {{ backup_external_drive[0]['dev_name'] }}"
