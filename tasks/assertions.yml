---
- name: ensure default variables are defined for the backup server
  when: backup_operation == 'h'
  ansible.builtin.assert:
    that:
      - backup_operation is defined
      - backup_operation is truthy
      - backup_logfile_name is defined
      - backup_logfile_name is truthy
      - backup_logfile_path is defined
      - backup_logfile_path is truthy
      - backup_directory is defined
      - backup_directory is truthy
      - backup_script_directory is defined
      - backup_script_directory is truthy
      - backup_archive_directory is defined
      - backup_archive_directory is truthy
      - backup_queue_name is defined
      - backup_queue_name is truthy
      - backup_queue_filepath is defined
      - backup_queue_filepath is truthy
      - backup_external_drive_option is defined
      - backup_cloud_backup_option is defined
    fail_msg: All these default variables need to be defined for the backup server

- name: ensure external drive backup variables are defined for the backup server if that option is enabled
  debugger: on_failed
  when: 
    - backup_operation == 'h'
    - backup_external_drive_option == true
  ansible.builtin.assert:
    that:
      - backup_freebsd_disk_scheme is defined
      - backup_freebsd_disk_scheme is truthy
      - backup_external_drive_option is defined
      - backup_external_drive_option is truthy
      - backup_external_drive_kickoff_time_hour is defined
      - backup_external_drive_kickoff_time_hour is number or backup_external_drive_kickoff_time_hour is string | trim | length > 0
      - backup_external_drive_kickoff_time_minute is defined
      - backup_external_drive_kickoff_time_minute is number or backup_external_drive_kickoff_time_minute is string | trim | length > 0
      - backup_external_drive_kickoff_time_day is defined
      - backup_external_drive_kickoff_time_day is number or backup_external_drive_kickoff_time_day is string | trim | length > 0
      - backup_external_drive_kickoff_time_month is defined
      - backup_external_drive_kickoff_time_month is number or backup_external_drive_kickoff_time_month is string | trim | length > 0
      - backup_external_drive_kickoff_time_weekday is number or backup_external_drive_kickoff_time_weekday is string | trim | length > 0
      - backup_external_drive_kickoff_time_weekday is number or backup_external_drive_kickoff_time_weekday is string | trim | length > 0
      - backup_external_drive_cronjob_name is defined
      - backup_external_drive_cronjob_job is truthy
    fail_msg:  "Check variables for backup server external backup option"

- name: ensure backup cloud variables are defined for the backup server if that option is enabled
  when: 
    - backup_operation == 'h'
    - backup_cloud_backup_option == true
  ansible.builtin.assert:
    that:
      - backup_cloud_backup_option is truthy
      - backup_cloud_backup_kickoff_time_hour is defined
      - backup_cloud_backup_kickoff_time_hour is number or backup_cloud_backup_kickoff_time_hour is string | trim | length > 0
      - backup_cloud_backup_kickoff_time_minute is defined
      - backup_cloud_backup_kickoff_time_minute is number or backup_cloud_backup_kickoff_time_minute is string | trim | length > 0
      - backup_cloud_backup_kickoff_time_day is defined
      - backup_cloud_backup_kickoff_time_day is number or backup_cloud_backup_kickoff_time_daystring is string | trim | length > 0
      - backup_cloud_backup_kickoff_time_month is defined
      - backup_cloud_backup_kickoff_time_month is number or backup_cloud_backup_kickoff_time_month is string | trim | length > 0
      - backup_cloud_backup_kickoff_time_weekday is defined
      - backup_cloud_backup_kickoff_time_weekday is number or backup_cloud_backup_kickoff_time_weekday is string | trim | length > 0
      - backup_cloud_backup_cronjob_name is defined
      - backup_cloud_backup_option is defined

- name: ensure default variables are defined for the remote host
  when: backup_operation == 'r'
  ansible.builtin.assert:
    that:
      - backup_remote_hostname is defined
      - backup_mount_point is defined
      - backup_mount_point is truthy
      - backup_remote_host_backup_kickoff_time_hour is defined
      - backup_remote_host_backup_kickoff_time_hour is number or backup_remote_host_backup_kickoff_time_hour is string | trim | length > 0
      - backup_remote_host_backup_kickoff_time_minute is defined
      - backup_remote_host_backup_kickoff_time_minute is number or backup_remote_host_backup_kickoff_time_minute is string | trim | length > 0 
      - backup_remote_host_backup_kickoff_time_day is defined
      - backup_remote_host_backup_kickoff_time_day is number or backup_remote_host_backup_kickoff_time_day is string | trim | length > 0
      - backup_remote_host_backup_kickoff_time_month is defined
      - backup_remote_host_backup_kickoff_time_month is number or backup_remote_host_backup_kickoff_time_month is string | trim | length > 0
      - backup_remote_host_backup_kickoff_time_weekday is defined
      - backup_remote_host_backup_kickoff_time_weekday is number or backup_remote_host_backup_kickoff_time_weekday is string | trim | length > 0
      - backup_remote_host_backup_cronjob_name is defined
      - backup_remote_host_backup_cronjob_name is truthy
      - backup_remote_host_backup_cronjob_job is defined
      - backup_remote_host_backup_cronjob_job is truthy
      - backup_mount_method is defined 
      - backup_mount_method is truthy
      - backup_cronjob_user is defined
      - backup_cronjob_user is truthy
      - backup_locations_to_backup is defined
      - backup_locations_to_backup is truthy
      - backup_exclude_directories is defined
    fail_msg: "Make sure these variables are defined for backup remote host setup"

- name: if setting up a backup server that is using backup external drive option is enabled check variables
  when: 
    - backup_operation == "h"
    - backup_external_drive_option == true
  ansible.builtin.assert:
    that:
      - backup_external_drive is defined
      - backup_external_drive is truthy
      - backup_external_drive_kickoff_time_hour is defined
      - backup_external_drive_kickoff_time_hour is number or backup_external_drive_kickoff_time_hour is string | trim | length > 0
      - backup_external_drive_kickoff_time_minute is defined
      - backup_external_drive_kickoff_time_minute is number or backup_external_drive_kickoff_time_minute is string | trim | length > 0
      - backup_external_drive_kickoff_time_day is defined
      - backup_external_drive_kickoff_time_day is number or backup_external_drive_kickoff_time_day is string | trim | length > 0
      - backup_external_drive_kickoff_time_month is defined
      - backup_external_drive_kickoff_time_month is number or backup_external_drive_kickoff_time_month is string | trim | length > 0
      - backup_external_drive_kickoff_time_weekday is defined
      - backup_external_drive_kickoff_time_weekday is number or backup_external_drive_kickoff_time_weekday is string | trim | length > 0
      - backup_external_drive_cronjob_name is defined
      - backup_external_drive_cronjob_name is truthy
      - backup_external_drive_cronjob_job is defined
      - backup_external_drive_cronjob_job is truthy 
      - backup_external_drive_kickoff_time_weekday is number or backup_external_drive_kickoff_time_weekday is string | trim | length > 0
