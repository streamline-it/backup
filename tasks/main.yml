---
# tasks file for backup

- name: ensure backup_operation is defined
  ansible.builtin.assert:
    that: 
      - backup_operation is defined
    fail_msg: >
      Make sure backup_operation is defined with value 
      of r - setup remote host or h - setup backup host

# For some reason some hosts fail to see "ansible_os_family" which is why I need to 
# call the next task
- name: run setup again to make sure ansible_os_family exists
  ansible.builtin.setup:

- name: include os specific variables
  include_vars: "{{ ansible_os_family }}_script_vars.yml"

- name: call tasks for assertions
  ansible.builtin.include_tasks: assertions.yml
 
- name: call task to ensure the backup host is configured
  when:
    - backup_operation == 'h'
  ansible.builtin.include_tasks: configure_backup_host.yml

- name: call task to ensure the remote host is configured
  when:
    - backup_operation == 'r'
  ansible.builtin.include_tasks: configure_remote_host.yml
