- name: ensure needed variables are defined specific to backup operations
  tags: backup
  ansible.builtin.assert:
    that:
      - backup_script_directory is defined
      - backup_scripts is defined
      - backup_mount_point is defined
      - backup_locations_to_backup is defined
    fail_msg: "Make sure to define the following variables (backup_script_directory, backup_scripts, backup_mount_point, backup_locations_to_backup)."

- name: ensure needed variables are defined specific to the backup cronjob
  tags: backup
  ansible.builtin.assert:
    that:
      - backup_cronjob_user is defined
      - backup_remote_host_backup_cronjob_name is defined
      - backup_remote_host_backup_cronjob_job is defined
      - backup_remote_host_backup_kickoff_time_minute is defined
      - backup_remote_host_backup_kickoff_time_hour is defined
      - backup_remote_host_backup_kickoff_time_day is defined
      - backup_remote_host_backup_kickoff_time_month is defined
      - backup_remote_host_backup_kickoff_time_weekday is defined
    fail_msg: >
      "Make sure to define the following variables (backup_cronjob_user, backup_remote_backup_cronjob_name, backup_remote_backup_cronjob_job,  
      backup_remote_backup_kickoff_time_minute, backup_remote_backup_kickoff_time_hour, backup_remote_backup_kickoff_time_day, 
      backup_remote_backup_kickoff_time_month, backup_remote_backup_kickoff_time_weekday"

- name: ensure backup script(s) directory exists
  tags: backup
  ansible.builtin.file:
    path: "{{ backup_script_directory }}"
    state: directory

- name: ensure free_space_for_backup.txt file exists
  tags: backup
  ansible.builtin.copy:
    src: free_space_for_backup.txt
    dest: "{{ backup_script_directory }}/free_space_for_backup.txt "

- name: ensure backup scripts exists
  tags: backup
  loop:
    "{{ backup_scripts }}"
  ansible.builtin.template:
    src: "{{ item['template_name'] }}"
    dest: "{{ backup_script_directory }}/{{ item['script_name'] }}"
    owner: root
    mode: "0770"

- name: ensure backup mount directory(s) exists
  tags: backup
  ansible.builtin.file:
    path: "{{ backup_mount_point }}"
    state: directory

- name: ensure backup mount(s) exists in fstab
  tags: backup
  ansible.builtin.mount:
    src: "{{ backup_locations_to_backup[0]['remote_path'] }}"
    path: "{{ backup_mount_point }}"
    fstype: nfs
    boot: false
    dump: "0"
    state: present

- name: ensure host has backup cronjob enabled
  tags: backup
  ansible.builtin.cron:
    user: "{{ backup_cronjob_user }}"
    cron_file: "{{ backup_remote_host_backup_cronjob_name }}"
    name: "{{ backup_remote_host_backup_cronjob_name }}"
    job: "{{ backup_remote_host_backup_cronjob_job }}"
    minute: "{{ backup_remote_host_backup_kickoff_time_minute }}"
    hour: "{{ backup_remote_host_backup_kickoff_time_hour }}"
    day: "{{ backup_remote_host_backup_kickoff_time_day }}"
    month: "{{ backup_remote_host_backup_kickoff_time_month }}"
    weekday: "{{ backup_remote_host_backup_kickoff_time_weekday }}"
    state: present
