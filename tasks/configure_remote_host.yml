- name: ensure backup script(s) directory exists
  ansible.builtin.file:
    path: "{{ backup_script_directory }}"
    state: directory

- name: ensure rsync is installed (RHEL)
  when: ansible_os_family == "RedHat"
  loop:
    "{{ backup_misc_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present

- name: ensure rsync is installed (FreeBSD)
  when: ansible_os_family == "FreeBSD"
  loop:
    "{{ backup_misc_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present

- name: ensure free_space_for_backup.txt file exists
  ansible.builtin.copy:
    src: free_space_for_backup.txt
    dest: "{{ backup_script_directory }}/free_space_for_backup.txt "

- name: ensure backup scripts exists
  loop:
    "{{ backup_scripts }}"
  ansible.builtin.template:
    src: "{{ item['template_name'] }}"
    dest: "{{ backup_script_directory }}/{{ item['script_name'] }}"
    owner: root
    mode: "0770"

- name: ensure backup mount directory(s) exists
  ansible.builtin.file:
    path: "{{ backup_mount_point }}"
    state: directory

- name: ensure backup mount(s) exists in fstab
  ansible.builtin.mount:
    src: "{{ backup_locations_to_backup[0]['remote_path'] }}"
    path: "{{ backup_mount_point }}"
    fstype: nfs
    boot: false
    dump: "0"
    state: present

- name: ensure host has backup cronjob enabled
  ansible.builtin.cron:
    user: "{{ backup_cronjob_user }}"
    cron_file: "{{ backup_remote_host_backup_cronjob_name }}"
    name: "{{ backup_remote_host_backup_cronjob_name }}"
    job: "{{ backup_remote_host_backup_cronjob_job }}"
    minute: "{{ backup_remote_host_backup_kickoff_time_minute }}"
    hour: "{{ backup_remote_host_backup_kickoff_time_hour }}"
    day: "{{ backup_remote_host_backup_kickoff_time_day }}"
    month: "{{ backup_remote_host_backup_kickoff_time_month }}"
    weekday: "{{ backup_remote_host_backup_kickoff_time_weekday }}"
    state: present
