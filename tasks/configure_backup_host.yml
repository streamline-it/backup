---
# tasks file for backup

- name: ensure the backup folder exists
  ansible.builtin.file:
    path: "{{ backup_directory['dir_name'] }}"
    owner: "{{ backup_directory['owner'] }}"
    group: "{{ backup_directory['groups'] }}"
    mode: "0770"
    state: directory

- name: ensure the scripts directory exists
  ansible.builtin.file:
    path: "{{ backup_script_directory }}"
    mode: "0770"
    state: directory
    
- name: ensure the log file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ backup_logfile_path }}"

- name: ensure the backup queue file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ backup_queue_filepath }}"

- name: check to see of the remote drive has been partitioned
  when: 
    - backup_external_drive_option == true
  register: stat_var
  ansible.builtin.stat:
    path: "{{ backup_external_drive[0]['full_name'] }}"
    get_attributes: true

- name: call task to make sure drive is partitioned
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  ansible.builtin.include_tasks: "./tasks/{{ ansible_os_family }}_setup_external_drive.yml"

- name: ensure mountpoint for external drive exists
  when:
    - backup_external_drive_option == true
  ansible.builtin.file:
    path: "{{ backup_mount_point }}"
    state: directory

- name: ensure the remote drive is setup in fstab via device name
  when:
    - backup_external_drive_option == true
    - backup_mount_method == "device"
  ansible.builtin.mount:
    src: "{{ backup_external_drive[0]['full_name'] }}"
    path: "{{ backup_external_drive[0]['mount_point'] }}"
    fstype: "{{ backup_external_drive[0]['mount_fstype'] }}"
    boot: false
    dump: "0"
    state: present

- name: ensure the remote drive is setup in fstab via label
  when:
    - backup_external_drive_option == true
    - backup_mount_method == "label"
  ansible.builtin.mount:
    src: "/dev/gpt/{{ backup_external_drive[0]['label'] }}"
    path: "{{ backup_external_drive[0]['mount_point'] }}"
    fstype: "{{ backup_external_drive[0]['mount_fstype'] }}"
    boot: false
    dump: "0"
    state: present


- name: ensure the external drive cronjob exists
  when:
    - backup_external_drive_option == true
  ansible.builtin.cron:
    user: "{{ backup_cronjob_user }}"
    cron_file: "{{ backup_external_drive_cronjob_name }}"
    name: "{{ backup_external_drive_cronjob_name }}"
    job: "{{ backup_external_drive_cronjob_job }}"
    minute: "{{ backup_external_drive_kickoff_time_minute }}"
    hour: "{{ backup_external_drive_kickoff_time_hour }}"
    day: "{{ backup_external_drive_kickoff_time_day }}"
    month: "{{ backup_external_drive_kickoff_time_month }}"
    weekday: "{{ backup_external_drive_kickoff_time_weekday }}"
    state: present

- name: ensure the cloud backup cronjob exists
  when:
    - backup_cloud_backup_option == true
  tags: backup
  ansible.builtin.cron:
    user: "{{ backup_cronjob_user }}"
    cron_file: "{{ backup_cloud_backup_cronjob_name }}"
    name: "{{ backup_cloud_backup_cronjob_name }}"
    job: "{{ backup_cloud_backup_cronjob_job }}"
    minute: "{{ backup_cloud_backup_kickoff_time_minute }}"
    hour: "{{ backup_cloud_backup_kickoff_time_hour }}"
    day: "{{ backup_cloud_backup_kickoff_time_day }}"
    month: "{{ backup_cloud_backup_kickoff_time_month }}"
    weekday: "{{ backup_cloud_backup_kickoff_time_weekday }}"
    state: present

- name: ensure the external backup script exists
  tags: backup
  loop:
    "{{ backup_external_drive_scripts }}"
  ansible.builtin.template:
    src: "{{ item['template_name'] }}"
    dest: "{{ backup_script_directory }}/{{ item['script_name'] }}"
    mode: '0770'

- name: ensure backup related files exist
  tags: backup
  loop:
    - BackupDataFlag
    - free_space_for_backup.txt
    - tarexcludeddirectories
    - virus_scan_status.txt
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backup_script_directory }}/{{ item }}"

