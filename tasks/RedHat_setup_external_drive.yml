- name: ensure the remote drive is partitioned
  when:
    - backup_external_drive_option == true
    - stat_var['stat']['exists'] == false
  tags: backup
  community.general.parted:
    device: "{{ backup_external_drive[0]['dev_name'] }}"
    number: 1
    part_start: "1MiB"
    part_end: "{{ backup_external_drive[0]['size'] }}"
    state: present

- name: ensure prior OS is cleared from external drive
  ansible.builtin.command:
    cmd: "wipefs -af {{ backup_external_drive[0]['dev_name'] }}"

- name: ensure the remote drive has a filesystem
  when:
    - backup_external_drive_option == true
  tags: backup
  ansible.builtin.filesystem:
    dev: "{{ backup_external_drive[0]['dev_name'] }}1"
    fstype: "{{ backup_external_drive[0]['fstype'] }}"
    state: present
